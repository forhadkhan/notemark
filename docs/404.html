<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)');
  var toggle = document.getElementById('theme-toggle');
  function current() { var t = root.getAttribute('data-theme'); return t ? t : (dark && dark.matches ? 'dark' : 'light'); }
  function sync() { toggle.setAttribute('aria-label', current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'); }
  toggle.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('notemark-theme', next); } catch (e) { /* storage unavailable */ }
    sync();
  });
  sync();
  // Echo the missing path (textContent only, never markup).
  var p = location.pathname;
  if (p && p !== '/') document.getElementById('path').textContent = p.length > 48 ? p.slice(0, 47) + '\u2026' : p;
})();
